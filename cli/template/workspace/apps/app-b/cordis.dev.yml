- id: production
  name: "@cordisjs/plugin-include"
  config:
    path: ./cordis.yml
- id: timer
  name: "@cordisjs/plugin-timer"
- id: hmr
  name: "@cordisjs/plugin-hmr"
  config:
    base: ../../
    root: [packages/plugin-hello-b/src]
    ignored: ["**/node_modules/**", "**/dist/**", "**/.*"]
    debounce: 100
